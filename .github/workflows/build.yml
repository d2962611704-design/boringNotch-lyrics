name: Build custom lyrics app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Restore upstream binary files
        run: |
          # This repo carries only text sources (GitHub push API rejects binaries).
          # Binary assets (icons, MediaRemoteAdapter framework, sounds) come from
          # the upstream v2.7.3 tarball; our modified files already exist here
          # and are kept (--ignore-existing).
          curl -sSL -o /tmp/upstream.tar.gz https://codeload.github.com/TheBoredTeam/boring.notch/tarball/refs/tags/v2.7.3
          mkdir -p /tmp/upstream
          tar xzf /tmp/upstream.tar.gz -C /tmp/upstream --strip-components=1
          rsync -a --ignore-existing /tmp/upstream/ ./
          test -f mediaremote-adapter/MediaRemoteAdapter.framework/Versions/A/MediaRemoteAdapter
          test -d boringNotch/Assets.xcassets

      - name: Build
        run: |
          xcodebuild -project boringNotch.xcodeproj -target boringNotch -configuration Release -derivedDataPath build CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" build

      - name: Package
        run: |
          APP="build/Build/Products/Release/boringNotch.app"
          test -d "$APP"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$APP/Contents/Info.plist"
          ditto -c -k --keepParent "$APP" boringNotch-lyrics.zip
          ls -lh boringNotch-lyrics.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lyrics-build-${{ github.run_number }}
          name: Boring Notch 2.7.3 + synced lyrics (build ${{ github.run_number }})
          files: boringNotch-lyrics.zip
          body: |
            Custom build of Boring Notch 2.7.3 with reliable synced lyrics for Spotify (LRCLIB exact match, per-track cache, stale-fetch guard, robust LRC parsing, lyrics stay visible when paused, next line preview). Built from this repo's main branch.
